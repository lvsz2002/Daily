<div class="app-shell">

    </aside>

        <div class="week-strip" id="weekStrip"></div>

  { id:'processing', code:'180083081600P1004H', name:'测量数据处理理论与方法', shortName:'测量数据处理', credits:2, category:'必选课', room:'教二楼219', teachers:'闫昊明 / 张子占', color:'#285bc5', background:'#edf2fd', sessions:[ {day:3,start:11,end:13,weeks:[2,3,4,5,7,8,9]}, {day:5,start:1,end:3,weeks:range(2,9)}, {day:6,start:11,end:13,weeks:[6]} ] },
  { id:'navigation', code:'180083081601M3004H', name:'多传感器融合导航定位', shortName:'多传感器融合导航', credits:2, category:'必选课', room:'教二楼221', teachers:'刘根友 / 柴华', color:'#047e74', background:'#e5f5f0', sessions:[ {day:2,start:1,end:3,weeks:range(11,17)}, {day:4,start:1,end:3,weeks:range(11,17)} ] },
  { id:'insar', code:'180083081601M3006H', name:'高级InSAR与LiDAR测量技术', shortName:'高级InSAR与LiDAR', credits:2, category:'必选课', room:'教二楼427', teachers:'沈强 / 沈翔', color:'#5966b7', background:'#eff1fb', sessions:[ {day:3,start:11,end:13,weeks:range(11,17),room:'教二楼427'}, {day:5,start:1,end:3,weeks:range(11,17),room:'教二楼429'} ] },
  { id:'gnss', code:'180084070503P3006H', name:'全球导航卫星系统原理与应用', shortName:'全球导航卫星系统', credits:2.5, category:'专业课', room:'教一楼230', teachers:'党亚民 / 许长辉等', color:'#517a12', background:'#f0f6e2', sessions:[ {day:1,start:5,end:7,weeks:range(2,11)}, {day:3,start:5,end:7,weeks:range(2,11)} ] },

];
let prefs={start:DEFAULT_START,rooms:{}}, draft={start:DEFAULT_START,rooms:{}}, selected='', view='day', now=null;
const stamp=date=>Date.parse(`${date}T00:00:00Z`);
const isDate=date=>typeof date==='string' && /^\d{4}-\d{2}-\d{2}$/.test(date) && Number.isFinite(stamp(date)) && new Date(stamp(date)).toISOString().slice(0,10)===date;
const dayNumber=date=>new Date(stamp(date)).getUTCDay()||7;
const addDays=(date,days)=>new Date(stamp(date)+days*86400000).toISOString().slice(0,10);
const weekNumber=(date,start=DEFAULT_START)=>Math.floor((stamp(date)-stamp(start))/(7*86400000))+1;
const weekStart=date=>addDays(date,1-dayNumber(date));
function chinaNow(value=new Date()){const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(value); const get=t=>parts.find(p=>p.type===t).value; return {date:`${get('year')}-${get('month')}-${get('day')}`,time:`${get('hour')}:${get('minute')}`};}
const formatDate=(date,short=false)=>short?`${Number(date.slice(5,7))}/${Number(date.slice(8))}`:`${Number(date.slice(5,7))}月${Number(date.slice(8))}日`;
function roomKey(course, session){const splitRooms=new Set(course.sessions.map(s=>s.room||course.room)).size>1; return splitRooms?`${course.id}:${session.day}:${session.start}`:course.id;}
function roomFields(course){return course.sessions.filter((s,i,all)=>all.findIndex(o=>roomKey(course,o)===roomKey(course,s))===i).map(session=>({key:roomKey(course,session),session,defaultRoom:session.room||course.room}));}
function getRoom(course,session,p=prefs){return (p.rooms[roomKey(course,session)]||'').trim() || session.room || course.room;}
function courseRooms(course,p=prefs){return [...new Set(course.sessions.map(s=>getRoom(course,s,p)))].join(' / ');}
function eventsOn(date,start=DEFAULT_START){if(!isDate(date)||!isDate(start))return[]; const week=weekNumber(date,start); if(week<1||week>TERM_WEEKS)return[]; return courses.flatMap(course=>course.sessions.filter(s=>s.day===dayNumber(date)&&s.weeks.includes(week)).map(s=>({key:`${date}-${course.id}-${s.start}`,date,course,session:s,startPeriod:s.start,endPeriod:s.end,startTime:periods[s.start-1].start,endTime:periods[s.end-1].end}))).sort((a,b)=>a.startPeriod-b.startPeriod);}
function nextEvent(date,time,start=DEFAULT_START){for(let d=date<start?start:date,end=addDays(start,TERM_WEEKS*7);d<end;d=addDays(d,1)){const e=eventsOn(d,start).find(x=>d!==date||x.endTime>time); if(e)return e;} return null;}
function weeksLabel(weeks){const groups=[]; for(let i=0;i<weeks.length;i++){const st=weeks[i];let en=st;while(weeks[i+1]===en+1)en=weeks[++i];groups.push(st===en?`${st}`:`${st}–${en}`);} return groups.join('、');}
function tone(c){return `--course:${c.color};--course-bg:${c.background}`;}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function initPrefs(){try{const stored=JSON.parse(localStorage.getItem(storageKey)||'null'); if(stored&&isDate(stored.start)&&dayNumber(stored.start)===1){const rooms=Object.fromEntries(courses.flatMap(c=>roomFields(c).map(f=>[f.key,typeof stored.rooms?.[f.key]==='string'?stored.rooms[f.key].slice(0,60):f.defaultRoom]))); prefs={start:stored.start,rooms};}}catch{showNotice('无法读取本机设置，已使用原始课表。')}}
function showNotice(msg){const n=document.getElementById('notice'); n.innerHTML=`${esc(msg)}<button aria-label="关闭提示" onclick="this.parentElement.classList.add('hidden')">×</button>`; n.classList.remove('hidden');}
function jump(value){if(isDate(value)){selected=value; render();}}
function setView(v){view=v; render();}
function render(){now=chinaNow(); if(!selected)selected=now.date; const date=selected, week=weekNumber(date,prefs.start), monday=weekStart(date), days=Array.from({length:7},(_,i)=>addDays(monday,i)), lessons=eventsOn(date,prefs.start), weekLessons=days.flatMap(d=>eventsOn(d,prefs.start)), outside=week<1||week>TERM_WEEKS, upcoming=nextEvent(now.date,now.time,prefs.start);
 document.getElementById('todayLabel').textContent=`${formatDate(now.date)} · 星期${weekdays[dayNumber(now.date)-1]}`;
 document.getElementById('weekCount').innerHTML=`${weekLessons.length}<span> 堂</span>`;
 document.getElementById('weekTitle').innerHTML=`${outside?'学期外':`第 ${week} 周`}<span>${formatDate(monday,true)} – ${formatDate(addDays(monday,6),true)}</span>`;
 document.getElementById('dateInput').value=date; document.getElementById('dayTitle').innerHTML=`${date===now.date?'今天的安排':formatDate(date)+'的安排'}<span>${lessons.length} 堂课</span>`;
 document.getElementById('nextKind').textContent=upcoming&&now.date===upcoming.date&&now.time>=upcoming.startTime?'上课时段':'接下来的一堂课';
 document.getElementById('nextClassBox').innerHTML= upcoming?`<h3>${esc(upcoming.course.name)}</h3><p class="next-date">${upcoming.date===now.date?'今天':formatDate(upcoming.date)} · 周${weekdays[dayNumber(upcoming.date)-1]}</p><div class="next-info"><span>🕒 ${upcoming.startTime}–${upcoming.endTime}</span><span>📍 ${esc(getRoom(upcoming.course,upcoming.session))}</span></div><button class="btn btn-ghost next-action" onclick="jump('${upcoming.date}');setView('day')">查看当天安排 <span>↗</span></button>`:`<h3>本学期课程已结束</h3><p class="next-date">仍可切换日期查看历史安排。</p>`;
 document.getElementById('legend').innerHTML=courses.map(c=>`<button onclick="openDetail('${c.id}')"><i style="background:${c.color}"></i><span>${esc(c.shortName)}</span><span class="credits">${c.credits} 学分</span></button>`).join('');
 const weekSelect=document.getElementById('weekSelect'); weekSelect.innerHTML='<option value="">选择周次</option>'+Array.from({length:TERM_WEEKS},(_,i)=>`<option value="${i+1}">第 ${i+1} 周</option>`).join(''); weekSelect.value=outside?'':String(week);
 document.querySelectorAll('#viewTabs button').forEach(b=>b.dataset.active=String(b.dataset.view===view)); document.querySelectorAll('.tabs-content').forEach(el=>el.classList.remove('active')); document.getElementById(view+'View').classList.add('active');
 document.getElementById('weekStrip').innerHTML=days.map((d,i)=>`<button class="${d===date?'selected':''} ${d===now.date?'is-today':''}" onclick="jump('${d}'); if(view==='courses') setView('day')" aria-pressed="${d===date}"><span>周${weekdays[i]}</span><strong>${Number(d.slice(-2))}</strong><div class="day-dots">${eventsOn(d,prefs.start).map(e=>`<i style="background:${e.course.color}"></i>`).join('')}</div></button>`).join('');
 document.getElementById('lessonArea').innerHTML= lessons.length?`<div class="lesson-list">${lessons.map(lessonCard).join('')}</div>`:`<div class="empty-day"><div style="font-size:40px">📆</div><h3>${outside?'这一天不在本学期内':'这一天没有课'}</h3><p>${outside?'可选择第1–20周查看学期课程。':'留一点时间，给阅读、研究和生活。'}</p></div>`;
 renderWeekly(days,weekLessons,week); renderCourses();}
function lessonCard(l){const c=l.course; const state=now.date===selected?(now.time<l.startTime?'未开始':now.time>=l.endTime?'已结束':'上课时段'):''; return `<div class="lesson-row"><div class="lesson-time"><strong>${l.startTime}</strong><span>${l.endTime}</span></div><button class="lesson-card" style="${tone(c)}" onclick="openDetail('${c.id}')"><div class="lesson-top"><span class="eyebrow">${esc(c.category)} · 第${l.startPeriod}–${l.endPeriod}节</span>${state?`<span class="lesson-status ${state==='上课时段'?'live':''}">${state}</span>`:''}</div><h3>${esc(c.name)}</h3><div class="lesson-meta"><span>📍 ${esc(getRoom(c,l.session))}</span><span>${esc(c.teachers)}</span><span class="detail-arrow">↗</span></div></button></div>`;}
function renderWeekly(days,weekLessons,week){const grid=document.getElementById('weeklyGrid'); let html=`<div class="grid-corner" style="grid-column:1;grid-row:1">节次</div>`; html+=days.map((d,i)=>`<div class="grid-day ${d===now.date?'current-day':''}" style="grid-column:${i+2};grid-row:1">周${weekdays[i]}<small>${formatDate(d,true)}</small></div>`).join(''); html+=periods.map((p,i)=>`<div class="period-label" style="grid-column:1;grid-row:${i+2}"><strong>${p.number}</strong><span>${p.start}</span><span>${p.end}</span></div>`).join(''); html+=days.flatMap((d,i)=>periods.map((p,j)=>`<div class="grid-slot ${i>=5?'weekend':''} ${[4,9].includes(j)?'block-start':''}" style="grid-column:${i+2};grid-row:${j+2}"></div>`)).join(''); html+=weekLessons.map(e=>`<button class="grid-lesson" style="${tone(e.course)};grid-column:${dayNumber(e.date)+1};grid-row:${e.startPeriod+1} / span ${e.endPeriod-e.startPeriod+1}" onclick="openDetail('${e.course.id}')"><strong>${esc(e.course.name)}</strong><span>${esc(getRoom(e.course,e.session))}</span><small>${e.startTime}–${e.endTime}</small></button>`).join(''); grid.innerHTML=html; grid.setAttribute('aria-label',`第${week}周课表`);}
function renderCourses(){document.getElementById('courseList').innerHTML=courses.map(c=>`<button class="course-item" style="${tone(c)}" onclick="openDetail('${c.id}')"><div class="course-symbol">🎓</div><div><h3>${esc(c.name)}</h3><p>${esc(courseRooms(c))} · ${esc(c.teachers)}</p><span>${c.sessions.map(s=>`周${weekdays[s.day-1]} ${s.start}–${s.end}节`).join(' / ')}</span></div><strong>${c.credits}<small>学分</small></strong><span>›</span></button>`).join('');}
function openDetail(id){const c=courses.find(x=>x.id===id); if(!c)return; const overlay=document.getElementById('detailOverlay'); document.getElementById('detailDialog').innerHTML=`<button class="dialog-close" onclick="closeDialogs()" aria-label="关闭课程详情">×</button><div class="detail-color" style="background:${c.color}"></div><h2 class="detail-title" id="detailTitle">${esc(c.name)}</h2><p>${esc(c.category)} · ${c.credits} 学分</p><dl class="detail-facts"><div><dt>教室</dt><dd>📍 ${esc(courseRooms(c))}</dd></div><div><dt>教师</dt><dd>${esc(c.teachers)}</dd></div><div><dt>课程编码</dt><dd class="course-code">${esc(c.code)}</dd></div></dl><h3 class="detail-subtitle">上课安排</h3><div class="session-list">${c.sessions.map(s=>`<div><strong>周${weekdays[s.day-1]} · ${periods[s.start-1].start}–${periods[s.end-1].end}</strong><p>第${s.start}–${s.end}节 · 第${weeksLabel(s.weeks)}周</p><p class="session-room">📍 ${esc(getRoom(c,s))}</p></div>`).join('')}</div><p class="source-note">教室按原始课程表与最新选课详情核对；如有调整，可在设置中修改本机显示。</p>`; overlay.classList.add('open');}
function openSettings(){draft={start:prefs.start,rooms:{...prefs.rooms}}; const overlay=document.getElementById('settingsOverlay'); document.getElementById('settingsDialog').innerHTML=`<button class="dialog-close" onclick="closeDialogs()" aria-label="关闭设置">×</button><h2 class="detail-title" id="settingsTitle">课表设置</h2><p>设置保存在当前设备，不会自动同步到其他设备。</p><label class="setting-field"><span>第一周的星期一</span><input type="date" id="startDraft" value="${draft.start}"></label><p class="source-note">默认 2026年8月31日。9月7日为第2周，课程从第2周开始。</p><h3 class="detail-subtitle">教室调整</h3>${courses.flatMap(c=>roomFields(c).map(f=>`<label class="room-field"><span>${esc(c.shortName)}${roomFields(c).length>1?`<small>周${weekdays[f.session.day-1]} · ${f.session.start}–${f.session.end}节</small>`:''}</span><input data-room-key="${f.key}" value="${esc(draft.rooms[f.key]??f.defaultRoom)}" maxlength="60"></label>`)).join('')}<p class="setting-message hidden" id="settingMessage"></p><button class="btn save-button" onclick="saveSettings()">保存设置</button><details class="about"><summary>手机使用与数据来源</summary><p>手机浏览器打开本站后，可通过浏览器菜单「添加到主屏幕」。联网加载后支持离线查看。本站按你的选择公开免登录，持有链接的人可以查看课表。</p><p>系统不自动获取教务变动。临时调停课和考试安排需核对教师通知；导入日历也不自动更新。</p><a href="https://earth.ucas.ac.cn/index.php/zh-CN/jwjx/gzzd/15521-2026-2027" target="_blank" rel="noreferrer">国科大 2026–2027 学年校历 ↗</a><a href="https://welcome.ucas.ac.cn/index.php/zh-cn/gxfw/tongzhi" target="_blank" rel="noreferrer">迎新通知：8月31日开始秋季学期 ↗</a><a href="https://github.com/LeoHerrmann/Timetable" target="_blank" rel="noreferrer">功能参考：开源 Timetable PWA ↗</a><p>周次读取Excel的L列，星期与节次读取M列，教室读取N列；节次时间采用附件6。界面与实现独立编写。</p></details>`; overlay.classList.add('open');}
function saveSettings(){const start=document.getElementById('startDraft').value; const msg=document.getElementById('settingMessage'); if(!isDate(start)||dayNumber(start)!==1){msg.textContent='第一周起始日期必须为星期一。';msg.classList.remove('hidden');return;} const rooms={}; document.querySelectorAll('[data-room-key]').forEach(i=>rooms[i.dataset.roomKey]=i.value.slice(0,60)); try{localStorage.setItem(storageKey,JSON.stringify({start,rooms})); prefs={start,rooms}; closeDialogs(); showNotice('设置已保存到这台设备。'); render();}catch{msg.textContent='浏览器禁止保存设置，请允许本地存储后重试。';msg.classList.remove('hidden');}}
function closeDialogs(){document.querySelectorAll('.dialog-overlay').forEach(o=>o.classList.remove('open'));}
function toCalendar(){
  const escapeText=v=>v.replaceAll('\\','\\\\').replaceAll('\n','\\n').replaceAll(',','\\,').replaceAll(';','\\;');
  const utcTime=(date,time)=>new Date(`${date}T${time}:00+08:00`).toISOString().replaceAll('-','').replaceAll(':','').replace('.000','');
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//UCAS Personal Timetable//ZH','CALSCALE:GREGORIAN','X-WR-CALNAME:国科大2026秋季课表'];
  for(let i=0;i<TERM_WEEKS*7;i++) for(const e of eventsOn(addDays(prefs.start,i),prefs.start)) lines.push('BEGIN:VEVENT',`UID:${e.key}@ucas-personal-timetable`,'DTSTAMP:20260907T000000Z',`DTSTART:${utcTime(e.date,e.startTime)}`,`DTEND:${utcTime(e.date,e.endTime)}`,`SUMMARY:${escapeText(e.course.name)}`,`LOCATION:${escapeText(getRoom(e.course,e.session))}`,`DESCRIPTION:${escapeText(`${e.course.teachers}\n第${weekNumber(e.date,prefs.start)}周 第${e.startPeriod}-${e.endPeriod}节\n临时调停课以教师通知为准。`)}`,'END:VEVENT');
  lines.push('END:VCALENDAR');
  return lines.join('\r\n')+'\r\n';
}
function downloadCalendar(){const url=URL.createObjectURL(new Blob([toCalendar()],{type:'text/calendar;charset=utf-8'})); const a=document.createElement('a'); a.href=url; a.download='UCAS-2026-autumn.ics'; a.click(); setTimeout(()=>URL.revokeObjectURL(url),1000); showNotice('日历文件已导出，可导入手机日历；后续修改不会自动同步。');}
document.getElementById('settingsBtn').onclick=openSettings; document.getElementById('todayBtn').onclick=()=>jump(chinaNow().date); document.getElementById('prevWeek').onclick=()=>jump(addDays(selected||chinaNow().date,-7)); document.getElementById('nextWeek').onclick=()=>jump(addDays(selected||chinaNow().date,7)); document.getElementById('dateInput').onchange=e=>jump(e.target.value); document.getElementById('weekSelect').onchange=e=>{if(e.target.value)jump(addDays(prefs.start,(Number(e.target.value)-1)*7+dayNumber(selected||chinaNow().date)-1));}; document.getElementById('downloadBtn').onclick=downloadCalendar; document.querySelectorAll('#viewTabs button').forEach(b=>b.onclick=()=>setView(b.dataset.view)); document.querySelectorAll('.dialog-overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)closeDialogs();})); window.addEventListener('keydown',e=>{if(e.key==='Escape')closeDialogs();});
initPrefs(); selected=chinaNow().date; render(); setInterval(render,30000);
</script>
